name: CI

on:
  pull_request:
  push:
    branches:
      - build/part4-lakehouse
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies
        run: uv sync --extra dev
      - name: Python lint and tests
        run: |
          uv run ruff check src tests pipelines
          uv run pytest tests/unit tests/integration -q
      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --outfile /tmp/part4-main.json
      - name: Install site dependencies
        run: npm ci
      - name: Validate and build portfolio
        run: npm run check
      - name: Browser installation
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Publication attribution scan
        run: npm run scan:publication
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
